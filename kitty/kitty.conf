include kitten.conf

# Initial window size and position
# initial_window_width 1000  # Set the initial width of the terminal window to 1000 pixels
# initial_window_height 600  # Set the initial height of the terminal window to 600 pixels
# initial_window_x 50  # Set the initial horizontal position of the terminal window to 50 pixels from the left
# initial_window_y 50  # Set the initial vertical position of the terminal window to 50 pixels from the top

# Font settings
# Set the font family to "Fira Code"
font_family Fira Code

# Set the font size to 12.0 points
font_size 12

# Background and foreground colors
# background_opacity 1

# Set the background color to a dark gray (#1e1e1e)
background #1e1e1e  

# Set the foreground color to a light gray (#d0d0d0)
foreground #d0d0d0  

# Cursor settings
# Set the cursor shape to a block
cursor_shape block  

# Set the cursor blink interval to 0.4 seconds
cursor_blink_interval 0.4  

# Set the cursor color to a light gray (#d0d0d0)
cursor_color #d0d0d0  

# Scrolling behavior
# Set the number of scrollback lines to 10000
scrollback_lines 10000  
scrollback_pager less -r  # Use 'less' as the pager for scrolling through the terminal output

# Keyboard and mouse bindings
map kitty @ clear-scrollback  # Bind the '@' key to clear the scrollback buffer

map kitty @ set-colors --reset  # Bind the '@' key to reset the colors
map kitty @ set-colors --opacity=0.9  # Bind the '@' key to adjust the opacity

map kitty @ increase-font-size  # Bind the '@' key to increase the font size
map kitty @ decrease-font-size  # Bind the '@' key to decrease the font size

map kitty @ search  # Bind the '@' key to initiate a search in the terminal
map kitty @ clear-search  # Bind the '@' key to clear the search results

# Vim-like keybindings
map kitty @ send-text all \x1b  # Bind the '@' key to send the Escape key to the terminal
map kitty @ send-text all \x0c  # Bind the '@' key to send Ctrl + L to the terminal (clear screen)
map kitty @ send-text all \x1b[C  # Bind the '@' key to send the Right Arrow key to the terminal
map kitty @ send-text all \x1b[D  # Bind the '@' key to send the Left Arrow key to the terminal
map kitty @ send-text all \x1b[B  # Bind the '@' key to send the Down Arrow key to the terminal
map kitty @ send-text all \x1b[A  # Bind the '@' key to send the Up Arrow key to the terminal

# Window management
map kitty @ new-window --new-tab=my_tab_title  # Bind the '@' key to create a new tab with a custom title
map kitty @ new-window --new-window=my_window_title  # Bind the '@' key to create a new window with a custom title
map kitty @ close-window  # Bind the '@' key to close the current window

map kitty @ move-window-up  # Bind the '@' key to move the current window up
map kitty @ move-window-down  # Bind the '@' key to move the current window down
map kitty @ move-window-left  # Bind the '@' key to move the current window left
map kitty @ move-window-right  # Bind the '@' key to move the current window right

map kitty @ move-tab-right  # Bind the '@' key to move the current tab to the right
map kitty @ move-tab-left  # Bind the '@' key to move the current tab to the left

# Shell integration
# Enable remote control of kitty using the kitty remote-control command
allow_remote_control no
listen_on unix:/tmp/kitty.sock  # Specify the Unix domain socket to listen on for remote control commands

# Deaktiviert die Bestätigung beim Schließen von Programmen in Kitty
confirm_os_window_close 0

# Disable alert
enable_audio_bell no

# Bind the 'Ctrl + +' key to increase font size (zoom in)
map ctrl+= increase_font_size

# Bind the 'Ctrl + -' key to decrease font size (zoom out)
map ctrl+- decrease_font_size

# Bind the 'Ctrl + 0' key to reset font size to default
map ctrl+0 reset_font_size
